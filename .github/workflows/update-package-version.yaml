---
name: update package version
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to update
        required: true
        type: choice
        options:
          - android-studio
          - cava
          - easyeffects
          - eden
          - ghostty
          - gtk4-layer-shell
          - helium
          - herdr
          - zed
          - zen-browser
      version:
        description: New upstream version (without v prefix)
        required: true
        type: string
permissions:
  contents: write
  actions: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Update specs
        id: update
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9][0-9A-Za-z._+~-]*$ ]] || {
            echo "::error::Invalid version: $VERSION"
            exit 1
          }

          case "$PACKAGE" in
            android-studio) SPECS="android-studio/android-studio.spec" ;;
            cava) SPECS="cava/cava.spec" ;;
            easyeffects) SPECS="easyeffects/easyeffects.spec" ;;
            eden) SPECS="eden/eden.spec" ;;
            ghostty) SPECS="ghostty/ghostty.spec" ;;
            gtk4-layer-shell) SPECS="ghostty/gtk4-layer-shell.spec" ;;
            helium) SPECS="helium/helium.spec" ;;
            herdr) SPECS="herdr/herdr.spec" ;;
            zed) SPECS="zed/zed.spec zed/zed-aarch64.spec" ;;
            zen-browser) SPECS="zen-browser/zen-browser.spec zen-browser/zen-browser-aarch64.spec" ;;
            *) echo "::error::Unknown package: $PACKAGE"; exit 1 ;;
          esac

          for SPEC in $SPECS; do
            sed -Ei "0,/^Version:/s/^Version:.*/Version:        $VERSION/" "$SPEC"
            sed -Ei '0,/^Release:[[:space:]]*[0-9]+/s/^Release:.*/Release:        1%{?dist}/' "$SPEC"
          done
          git diff --check
          git diff --exit-code && {
            echo "::error::$PACKAGE is already at $VERSION"
            exit 1
          }
          echo "specs=$SPECS" >> "$GITHUB_OUTPUT"

      - name: Commit and build
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
          SPECS: ${{ steps.update.outputs.specs }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- $SPECS
          git commit -m "chore($PACKAGE): update to $VERSION"
          git push
          for SPEC in $SPECS; do
            gh workflow run trigger-copr-builds.yaml --ref main -f spec_file="$SPEC"
          done
