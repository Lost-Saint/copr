---
name: update package versions
on:
  schedule:
    - cron: "43 7 * * *"
permissions:
  contents: write
  actions: write
concurrency:
  group: update-package-versions
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check and update versions
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/update-package-versions.sh

          SPECS=$(git diff --name-only --diff-filter=ACM -- '*.spec')
          if [ -z "$SPECS" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --check
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "specs<<EOF"
            printf '%s\n' "$SPECS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and build changed specs
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SPECS: ${{ steps.update.outputs.specs }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          while IFS= read -r spec; do
            git add -- "$spec"
          done <<< "$SPECS"

          git commit -m "chore(specs): update package versions"
          git push

          while IFS= read -r spec; do
            gh workflow run trigger-copr-builds.yaml --ref main -f spec_file="$spec"
          done <<< "$SPECS"
