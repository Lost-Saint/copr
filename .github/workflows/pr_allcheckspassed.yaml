---
name: allcheckspassed # https://github.com/wechuli/allcheckspassed
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions: {}
concurrency:
  # yamllint disable-line rule:line-length
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  allcheckspassed:
    runs-on: ubuntu-latest
    permissions:
      checks: read # required to poll checks
    steps:
      # yamllint disable-line rule:line-length
      - uses: wechuli/allcheckspassed@1e77c91db5ec91faa94bf441f91b91327d269ab0 # v2.6.0
        with:
          delay: "3" # default: 1
          retries: "15" # default: 10
          polling_interval: "1" # default
