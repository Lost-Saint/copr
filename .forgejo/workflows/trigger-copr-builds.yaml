---
name: Trigger COPR builds

on:
  push:
    branches: [main]
    paths:
      - "**/*.spec"
  workflow_dispatch:
    inputs:
      # checkov:skip=CKV_GHA_7:validated before use
      spec_file:
        description: "Spec file to rebuild (for example: ghostty/ghostty.spec)"
        required: true
        type: string

permissions: {}

env:
  COPR_OWNER: myriad-sun

jobs:
  trigger-builds:
    runs-on: codeberg-small
    permissions:
      contents: read

    steps:
      - uses: https://data.forgejo.org/actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find specs to build
        id: specs
        env:
          MANUAL_SPEC: ${{ inputs.spec_file }}
        run: |
          set -euo pipefail

          if [ "${FORGEJO_EVENT_NAME:-${GITHUB_EVENT_NAME:-}}" = "workflow_dispatch" ]; then
            spec_files="$MANUAL_SPEC"
          else
            event_path="${FORGEJO_EVENT_PATH:-${GITHUB_EVENT_PATH:?}}"
            before="$(jq -r '.before // empty' "$event_path")"
            after="${FORGEJO_SHA:-${GITHUB_SHA:?}}"

            if [ -n "$before" ] && ! [[ "$before" =~ ^0+$ ]]; then
              spec_files="$(git diff --diff-filter=ACMR --name-only \
                "$before" "$after" -- '*.spec')"
            else
              spec_files="$(git diff-tree --root --diff-filter=ACMR \
                --no-commit-id --name-only -r "$after" -- '*.spec')"
            fi
          fi

          while IFS= read -r spec; do
            [ -z "$spec" ] && continue
            if ! [[ "$spec" =~ ^[A-Za-z0-9._+-]+/[A-Za-z0-9._+/-]+\.spec$ ]] ||
              [ ! -f "$spec" ] ||
              ! git ls-files --error-unmatch -- "$spec" >/dev/null 2>&1; then
              echo "::error file=$spec::Spec must be a tracked project/*.spec file"
              exit 1
            fi
          done <<< "$spec_files"

          {
            echo "files<<EOF"
            printf '%s\n' "$spec_files"
            echo "EOF"
          } >> "${GITHUB_OUTPUT:-${FORGEJO_OUTPUT:?}}"

      - name: Install copr-cli
        if: steps.specs.outputs.files != ''
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-venv libkrb5-dev
          python3 -m venv "${RUNNER_TEMP}/copr-venv"
          "${RUNNER_TEMP}/copr-venv/bin/pip" install copr-cli

      - name: Configure copr-cli
        if: steps.specs.outputs.files != ''
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.config
          install -m 600 /dev/null ~/.config/copr
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr

      - name: Trigger builds
        if: steps.specs.outputs.files != ''
        env:
          SPEC_FILES: ${{ steps.specs.outputs.files }}
        run: |
          set -euo pipefail

          failed=0
          while IFS= read -r spec; do
            [ -z "$spec" ] && continue
            project="${spec%%/*}"
            package="$(basename "$spec" .spec)"

            echo "::notice file=$spec::Triggering ${COPR_OWNER}/${project}/${package}"
            if ! "${RUNNER_TEMP}/copr-venv/bin/copr-cli" build-package \
              "${COPR_OWNER}/${project}" \
              --name "$package" \
              --nowait; then
              echo "::error file=$spec::Failed to trigger $package"
              failed=1
            fi
          done <<< "$SPEC_FILES"
          exit "$failed"

      - name: Remove COPR credentials
        if: always()
        run: rm -f ~/.config/copr
